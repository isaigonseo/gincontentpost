name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: intel
          - os: macos-14
            arch: silicon
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --add-data "logo.png:." --add-data "icon.ico:." --collect-data "certifi" --name "GinContent Post" main.py
        
        # Copy guide into DMG folder if it exists
        if [ -f "HUONG_DAN_MAC.txt" ]; then
          cp HUONG_DAN_MAC.txt "dist/"
        fi
        
        # Make the executable run
        chmod +x "dist/GinContent Post.app/Contents/MacOS/GinContent Post"
        
        # Build DMG containing both the App and the Guide
        hdiutil create -volname "GinContent Post" -srcfolder "dist/" -ov -format UDZO "GinContent-Post-Mac-${{ matrix.arch }}.dmg"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GinContent-Post-Mac-${{ matrix.arch }}
        path: GinContent-Post-Mac-${{ matrix.arch }}.dmg
